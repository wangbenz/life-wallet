server:
  port: 8080

spring:
  application:
    name: life-wallet-api
  datasource:
    # 本地默认使用文件型 H2，设置 DB_URL 后可无代码切换到 MySQL。
    url: ${DB_URL:jdbc:h2:file:./data/life-wallet;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:100}
      # 最大容量提高后仍只预热少量空闲连接，避免测试环境启动时直接占满数据库。
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

life-wallet:
  agent:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      api-key-file: ${DEEPSEEK_API_KEY_FILE:}
      master-key-file: ${DEEPSEEK_MASTER_KEY_FILE:}
      secret-persistence-enabled: ${DEEPSEEK_SECRET_PERSISTENCE_ENABLED:true}
      model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
      connect-timeout: 5s
      read-timeout: 35s
      max-steps: 4
