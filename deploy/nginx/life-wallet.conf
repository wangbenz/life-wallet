server {
    listen 15173;
    listen [::]:15173;
    server_name _;

    root /var/www/life-wallet/current;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/life-wallet.access.log;
    error_log /var/log/nginx/life-wallet.error.log;

    # Vite 构建产物使用内容哈希，静态资源可以安全地长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # H5 后续即使增加前端路由，也统一回退到入口文件。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
